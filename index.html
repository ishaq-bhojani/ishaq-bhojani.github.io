    <!-- Google Search Console ownership proof for the URL-prefix property
         https://ishaq-bhojani.github.io/. Load-bearing, and not obviously so:
         removing it un-verifies the property, which silently stops sitemap
         submission and indexing requests from working — nothing on the site

         It has to be a meta tag. Search Console's other method, a DNS TXT
         record, is impossible here: that requires control of the `github.io`
         zone, and GitHub owns that, not us. There is no DNS provider to sign
         into, so this tag is the only proof of ownership available.

         Public by design — it is meant to be read off the page. Not a secret,
         and not something to move into an env var. `src/__tests__/geo.test.ts`
         pins the exact token. -->

    <!-- Both themes declared, so the browser chrome matches whichever is live
         before any script runs. The inline script below overrides this to the
         stored choice when the visitor has made one. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0618" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f7f4" />

    <!--
      Theme, resolved before first paint.

      This is inline and synchronous on purpose: any deferred or module script
      runs after the first paint, so the page would flash the wrong ground for a
      frame on every load. Reading localStorage and stamping data-theme here
      means the very first painted pixel is already correct.

      Kept tiny and self-contained — it must never be able to throw and block
      the document, hence the try/catch around storage, which is unavailable in
      some privacy modes.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ib-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
            /* Both theme-color metas, not just the first: the browser reads
               whichever one's media query matches the OS, so a pinned theme
               that disagrees with the OS lives in the second tag. */
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            var ground = stored === 'light' ? '#f8f7f4' : '#0e0618';
            for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', ground);
          }
        } catch (e) {
          /* No storage: fall through to prefers-color-scheme. */
        }
      })();
    </script>
